<title>UPI Link Tester</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one narrow column, inputs on top, one card per test link */
:root{--bg:#f6f7f5;--fg:#16201d;--mut:#5d6a66;--card:#ffffff;--line:#d9dfdb;--acc:#0e7f6c;--accfg:#ffffff;--code:#eef1ee;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111917;--fg:#e8efec;--mut:#9aaaa4;--card:#18231f;--line:#2b3a35;--acc:#3dbfa6;--accfg:#06201a;--code:#0e1513;--warn:#f0b35a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111917;--fg:#e8efec;--mut:#9aaaa4;--card:#18231f;--line:#2b3a35;--acc:#3dbfa6;--accfg:#06201a;--code:#0e1513;--warn:#f0b35a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}
p{margin:0;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;width:100%;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font-size:16px;margin:0}
code{display:block;background:var(--code);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--fg)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
a.go,button{font:inherit;font-weight:600;border-radius:8px;padding:10px 14px;border:1px solid var(--acc);cursor:pointer;text-decoration:none;text-align:center}
a.go{background:var(--acc);color:var(--accfg);flex:1 1 150px}
button{background:transparent;color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.note{font-size:13px;color:var(--warn)}
</style>
<main>
<h1>UPI Link Tester</h1>
<p>Open this page in Chrome on the phone that shows the error. Tap each link, choose Google Pay or PhonePe, press Pay, and note which links fail. Do not pay more than ₹1 on test 7.</p>
<div class="box">
<label>Food Place UPI ID<input id="pa" value="" placeholder="name@bank" autocapitalize="off" autocomplete="off"></label>
<label>Food Place name<input id="pn" value="" placeholder="As saved in MyFoodBill"></label>
<div class="row">
<label>Amount (₹)<input id="am" value="141" inputmode="decimal"></label>
<label>Place code<input id="code" value="ABC123"></label>
</div>
<div class="note" id="msg" hidden>Enter the UPI ID first.</div>
</div>
<div id="list" style="display:flex;flex-direction:column;gap:14px"></div>
</main>
<script>
var T=[
 ['1. Current MyFoodBill link','Exactly what the app builds now: encoded UPI ID, name, amount, INR, note.',function(f){return 'upi://pay?pa='+enc(f.pa)+'&pn='+enc(f.pn)+'&am='+f.am+'&cu=INR&tn='+enc('MyFoodBill parcel '+f.code)}],
 ['2. Plain @ in the UPI ID','Same as 1, but the @ is not turned into %40.',function(f){return 'upi://pay?pa='+f.pa+'&pn='+enc(f.pn)+'&am='+f.am+'&cu=INR&tn='+enc('MyFoodBill parcel '+f.code)}],
 ['3. Without the note','Only UPI ID, name, amount and INR.',function(f){return 'upi://pay?pa='+f.pa+'&pn='+enc(f.pn)+'&am='+f.am+'&cu=INR'}],
 ['4. Add a unique reference (tr)','Test 2 plus a new reference number on every tap.',function(f){return 'upi://pay?pa='+f.pa+'&pn='+enc(f.pn)+'&am='+f.am+'&cu=INR&tr='+tr()+'&tn='+enc('MFB '+f.code)}],
 ['5. Reference and category code (mc)','Test 4 plus mc=0000, the code used when a payee has no business category.',function(f){return 'upi://pay?pa='+f.pa+'&pn='+enc(f.pn)+'&mc=0000&am='+f.am+'&cu=INR&tr='+tr()+'&tn='+enc('MFB '+f.code)}],
 ['6. No amount (control)','Opens the payee only. You type the amount in the UPI app. This works like paying by UPI ID.',function(f){return 'upi://pay?pa='+f.pa+'&pn='+enc(f.pn)+'&cu=INR'}],
 ['7. Current link with ₹1.00','Same as 1 with the amount changed to 1.00, to see whether the amount or limit causes the error.',function(f){return 'upi://pay?pa='+enc(f.pa)+'&pn='+enc(f.pn)+'&am=1.00&cu=INR&tn='+enc('MyFoodBill parcel '+f.code)}]
];
function enc(s){return encodeURIComponent(s)}
function tr(){return 'MFB'+Date.now()}
function vals(){var a=parseFloat(document.getElementById('am').value);return{pa:document.getElementById('pa').value.trim(),pn:document.getElementById('pn').value.trim()||'MyFoodBill',am:(isFinite(a)?a:0).toFixed(2),code:document.getElementById('code').value.trim()||'ABC123'}}
function build(i){return T[i][2](vals())}
function render(){
 var f=vals(),ok=!!f.pa;document.getElementById('msg').hidden=ok;
 var h='';
 T.forEach(function(t,i){var u=ok?build(i):'';
  h+='<section class="box"><h2>'+t[0]+'</h2><p>'+t[1]+'</p><code id="u'+i+'">'+(ok?esc(u):'Enter the UPI ID above.')+'</code><div class="btns"><a class="go" id="a'+i+'" href="'+(ok?esc(u):'#')+'" data-i="'+i+'">Open UPI app</a><button type="button" data-c="'+i+'">Copy link</button></div></section>'});
 document.getElementById('list').innerHTML=h;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
document.addEventListener('click',function(e){
 var a=e.target.closest&&e.target.closest('a.go');
 if(a){if(!vals().pa){e.preventDefault();document.getElementById('msg').hidden=false;return}var i=+a.getAttribute('data-i'),u=build(i);a.href=u;document.getElementById('u'+i).textContent=u;return}
 var b=e.target.closest&&e.target.closest('button[data-c]');
 if(b){var i2=+b.getAttribute('data-c'),u2=build(i2),el=document.getElementById('u'+i2);el.textContent=u2;
  try{navigator.clipboard.writeText(u2).then(function(){b.textContent='Copied'},function(){sel(el)})}catch(x){sel(el)}}
});
function sel(el){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}
['pa','pn','am','code'].forEach(function(id){document.getElementById(id).addEventListener('input',render)});
render();
</script>
