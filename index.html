<!DOCTYPE html>
<html lang="en">
<head>

<title>MyFoodBill</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

#app{max-width:430px;margin:0 auto;min-height:100vh;padding:12px 14px 110px}
#app.hasnav{padding-bottom:150px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}

.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
h1{font-size:24px;font-weight:800;margin:4px 0 2px}

.part{height:6px;background:var(--line);margin:18px -14px 14px}

.stick .tabs{margin-bottom:8px}
.price{font-weight:600}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;padding:11px 16px;min-height:46px;border-radius:12px;cursor:pointer}

.btn:disabled{opacity:.5}

.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar>*{max-width:402px;margin:0 auto;display:flex;width:100%}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:7px 14px;border-radius:20px;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--mut)}
.tot.b{color:var(--ink);font-weight:800;font-size:18px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
input.p{width:80px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
.t{width:100%;font:inherit;padding:10px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fl{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.err{color:#c0392b;font-size:14px;margin-top:8px}
.fpbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.bioback{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.biosheet{background:var(--card);width:100%;max-width:430px;border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));text-align:center}
.fpring{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--acc)}
.fpring.wait{animation:fpp 1.4s ease-in-out infinite}
.fpring.fail{color:#c0392b}
@keyframes fpp{0%,100%{box-shadow:0 0 0 0 rgba(11,110,95,.35)}50%{box-shadow:0 0 0 14px rgba(11,110,95,0)}}
@media (prefers-reduced-motion:reduce){.fpring.wait{animation:none}}
.sw{width:50px;height:30px;border-radius:15px;border:0;background:#b8c4c2;position:relative;flex:none;cursor:pointer;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}
.sw.on i{left:23px}
@media print{.bioback{display:none}}
.sw{width:46px;height:26px;border-radius:13px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(20px)}
@media print{.noprint,.bar,.nav{display:none!important}.item{break-inside:avoid;page-break-inside:avoid}.printonly{display:block!important}:root:root:root{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#999}body{background:#fff;color:#000}#app{padding:0}}
.printonly{display:none}
@page{margin:12mm 12mm 16mm}
@page nums{margin:38mm 12mm 16mm;@top-center{content:var(--phLogo) " MyFoodBill\A " var(--ph2) "\A " var(--ph3) "\A " var(--ph4);white-space:pre;text-align:center;font:700 12pt sans-serif;line-height:1.35;color:#0e7f6c;vertical-align:bottom;padding-bottom:3mm}@bottom-center{content:"Page " counter(page) " of " counter(pages);font:10pt sans-serif;color:#444}}
@media print{#app.nums{page:nums;min-height:0!important}#app.nums .item[id]{display:inline-block;width:100%;box-sizing:border-box;vertical-align:top}img.shot{width:200px!important;max-width:200px!important;margin:6px auto 8px!important}}
.printhead{display:none}
.prhead{display:none}
@media print{.printhead{display:flex!important;align-items:center;justify-content:center;gap:10px;padding:0 0 8px;margin:0 0 6px;font-size:22px;font-weight:800;color:#0e7f6c}.pc{text-align:center}}
.ok{color:var(--ok);font-size:14px;margin-bottom:10px}
.appbar{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand{font-weight:800;font-size:19px;color:var(--acc)}
.lnk{border:0;background:none;color:var(--acc);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;min-height:32px}
.link{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}

.nav>div{display:flex;max-width:430px;margin:0 auto}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600;min-height:58px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav button.on{color:var(--acc)}
.nav svg{width:24px;height:24px}
#app.hasnav .bar{bottom:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.stepn{background:var(--acc);color:var(--acc-ink);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.hl{font-weight:800;font-size:12px;color:var(--acc);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.item ul,.item ol{margin:4px 0 0;padding-left:20px}
.item li{margin:4px 0;font-size:14px}
.shot{display:block;width:100%;max-width:300px;margin:12px auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(16,32,30,.15)}
.tabs.one{flex-wrap:nowrap;gap:3px;overflow-x:auto}
.tabs.one button{padding:10px 4px;font-size:13px;white-space:nowrap;flex:none}
@media(min-width:360px){.tabs.one button{font-size:14px}}
@media(min-width:388px){.tabs.one button{font-size:15px}}
@media(min-width:428px){.tabs.one button{font-size:16px}}
.dv{width:1px;background:var(--line);margin:2px 0;flex:none}
.appbar .btn{white-space:nowrap;padding:6px 12px}
.btn.ghost.on{background:var(--acc);color:var(--acc-ink)}
.tabs.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible}
.tabs.g3 button{padding:10px 2px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mi{font-size:19px;font-weight:600;line-height:1.25}
.mp{font-size:18px;font-weight:700}
.tabs.big{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:visible}
.tabs.big button{margin:0!important;padding:13px 0;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:360px){.tabs.big button{font-size:15px}}
@media(min-width:410px){.tabs.big button{font-size:16px}}
.tabs.one.big1 button{flex:1 1 auto;padding:13px 4px;font-size:14px;font-weight:600}
@media(min-width:360px){.tabs.one.big1 button{font-size:15px}}
@media(min-width:410px){.tabs.one.big1 button{font-size:16px}}
.paybtn{display:block;width:100%;min-height:50px;margin:10px 0;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:16px;pointer-events:none;transition:background .3s}
.paybtn.wait{background:var(--hi);color:#2a1d00}
.paybtn.ok{background:var(--ok);color:#fff}
.pl-ok{color:var(--ok)}
.pl-wait{color:#9a6700}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pl-wait{color:#f0b429}}
:root[data-theme="dark"] .pl-wait{color:#f0b429}
.tag{font-size:12px;background:var(--hi);color:#2a1d00;border-radius:6px;padding:2px 7px;font-weight:700}
.steps{display:flex;gap:4px;margin:14px 0}
.steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--acc)}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:14px}
.upl{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;margin-bottom:12px;cursor:pointer;color:var(--mut)}
label.opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);cursor:pointer}
.plan{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card)}
.plan.cur{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;max-width:min(92vw,400px);background:#c0392b;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.good{background:var(--acc);color:var(--acc-ink)}
.toast.show{opacity:1}
.qrgrid{display:grid;grid-template-columns:1fr;gap:0}
.qrimg{width:100%;max-width:220px;margin:8px auto}
.qrimg svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.qrcard{text-align:center}
.qrcard .row{justify-content:center}
.sw{border:0}
select.t{appearance:auto}
@media print{.qrgrid{grid-template-columns:1fr 1fr;gap:10mm}.qrcard{break-inside:avoid;border:1px solid #999;box-shadow:none}.qrimg{max-width:60mm}.toast{display:none}.printonly{display:block!important}}

@media print{#app.nums{max-width:none!important;width:100%!important;padding-left:0!important;padding-right:0!important}.sgrid{grid-template-columns:1fr 1fr!important}.slist{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slist .item{margin:0}}

#printdoc{display:none}
.prep-measure{position:absolute;left:-99999px;top:0;width:210mm}
.ppage{box-sizing:border-box;width:210mm;height:296mm;padding:10mm 12mm 8mm;display:flex;flex-direction:column;background:#fff;color:#000;overflow:hidden;break-after:page;page-break-after:always}
.ppage:last-child{break-after:auto;page-break-after:auto}
.phead{text-align:center;color:#0e7f6c;font-weight:700;line-height:1.4;margin-bottom:5mm;font-size:14px}
.phead .pl{display:flex;justify-content:center;align-items:center;gap:8px;font-size:20px;font-weight:800;margin-bottom:2px}
.phead .p2{font-size:16px}.phead .p4{font-size:12px;color:#444;font-weight:600}
.pbody{flex:1;min-height:0;overflow:hidden;font-size:13px}
.pfoot{text-align:center;font-size:12px;color:#444;padding-top:2mm;border-top:1px solid #999;margin-top:2mm}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-bottom:4px}
.pgrid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #ccc;padding:4px 2px;font-size:13px}
.ptitle{font-weight:800;font-size:14px;background:#e3e3e3;padding:3px 6px;margin:10px 0 4px}
.ptab{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px}
.ptab th{border-bottom:2px solid #333;padding:3px 4px;font-size:11px}

.ptab .l{text-align:left}.ptab .r{text-align:right}
.pnote{padding:12px 4px;font-size:14px}

@media print{body.rprint #app,body.rprint .toast,body.rprint #toast{display:none!important}body.rprint #printdoc{display:block!important;page:rep}body.rprint{background:#fff!important;margin:0}}

.phead .p5{font-size:12px;color:#222;font-weight:600}

/* ---- computer layout: side menu and wider pages (screens 1000px and wider) ---- */
@media screen and (min-width:1000px){
  #app.hasnav{max-width:none;margin:0 0 0 210px;padding:18px 36px 48px}

}

async function http(path,o){

  if(o.body!==undefined)h['Content-Type']='application/json';
  if(o.prefer)h.Prefer=o.prefer;
  if(S.sess&&o.auth!==false)h.Authorization='Bearer '+S.sess.access_token;
  var r;
  try{r=await fetch(CFG.url+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined})}
  catch(e){var ne=new Error('Cannot reach the server. Check your internet connection and try again. [Details: '+(e&&e.message||e)+' | page: '+location.protocol+'//'+(location.host||'local')+' | online: '+navigator.onLine+']');ne.net=true;throw ne}
  var t=await r.text(),j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){
    if(r.status===401&&S.sess&&o.auth!==false&&o.retry!==false){
      if(await refresh())return http(path,Object.assign({},o,{retry:false}));
      await forceLogout('Your session ended. Please log in again.');
    }
    var er=new Error(friendly((j&&(j.message||j.msg||j.error_description||j.error))||('Request failed ('+r.status+')'),j));er.code=j&&(j.code||j.error_code);throw er;
  }
  return j;
}

/* QR reader: the browser's own detector when it has one, otherwise the bundled jsQR (the Android app's WebView has no detector) */
function qrDetector(){
  if(window.BarcodeDetector)return new BarcodeDetector({formats:['qr_code']});
  var cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  return {detect:function(el){return new Promise(function(res){
    var w=el.videoWidth,h=el.videoHeight;if(!w||!h)return res([]);
    var k=Math.min(1,960/Math.max(w,h));cv.width=Math.round(w*k);cv.height=Math.round(h*k);cx.drawImage(el,0,0,cv.width,cv.height);
    var d=cx.getImageData(0,0,cv.width,cv.height),q=window.jsQR(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});
    res(q&&q.data?[{rawValue:q.data}]:[]);
  })}};
}

      if(el&&el.readyState>=2){det.detect(el).then(function(b){if(b&&b[0]&&C.cam){handleQR(b[0].rawValue)}else setTimeout(loop,300)}).catch(function(){setTimeout(loop,500)})}

function itemKey(id,po){return id+':'+po}
function setQty(k,d){var n=Math.max(0,Math.min(50,(C.cart[k]||0)+d));if(n)C.cart[k]=n;else delete C.cart[k];render()}
function calc(){
  var sub=0,qty=0,lines=[],ch=[],tot=0;
  C.menu.items.forEach(function(it){['full','half'].forEach(function(po){
    var q=C.cart[itemKey(it.id,po)]||0;if(!q)return;
    var pr=po==='half'?it.price_half_paise:it.price_full_paise;sub+=pr*q;qty+=q;lines.push({n:it.name+(po==='half'?' (Half)':''),q:q,p:pr});
  })});
  var disc=0,dl='';
  var dn='';
  if(sub>0){
    var rd=0,rl='',gd=0,gl='',P=C.place||{};
    if(C.disc){rd=C.disc.kind==='pct'?Math.round(sub*C.disc.value/100):Math.min(C.disc.value,sub);rl=C.disc.kind==='pct'?C.disc.value+'%':rs(C.disc.value)}
    if(P.offer_on&&P.offer_value){gd=P.offer_kind==='pct'?Math.round(sub*P.offer_value/100):Math.min(P.offer_value,sub);gl=P.offer_kind==='pct'?P.offer_value+'%':rs(P.offer_value)}
    if(gd>rd){disc=gd;dl=gl;dn=(P.offer_title||'Offer')+' '+gl}else if(rd>0){disc=rd;dl=rl;dn='Regular customer discount '+rl}
    disc=Math.max(0,Math.min(disc,sub));
  }
  var base=sub-disc;tot=base;
  C.menu.charges.forEach(function(c){var a=c.kind==='percent'?Math.round(base*c.value/100):Math.round(c.value*100);ch.push({n:c.name,a:a});tot+=a});
  if(C.type==='parcel')C.menu.pack.forEach(function(c){var a=c.per==='order'?c.cost_paise:c.cost_paise*qty;ch.push({n:'Packing: '+c.name,a:a});tot+=a});
  if(C.type==='parcel'&&C.ful==='delivery'&&C.place.offers_delivery&&C.place.delivery_charge_paise>0){ch.push({n:'Delivery charge',a:C.place.delivery_charge_paise});tot+=C.place.delivery_charge_paise}
  return {sub:sub,qty:qty,lines:lines,ch:ch,tot:tot,disc:disc,dl:dl,dn:dn};
}

async function fetchPlaceRow(){var r=await rest('food_places?select=*,is_open&id=eq.'+encodeURIComponent(O.place.id));if(r&&r[0])O.place=r[0]}
async function loadOwnerData(){

function ownAct(fn,args){act(async function(){await rpc(fn,args);await loadOrders()})}
function oAccept(id){ownAct('owner_accept_order',{p_order:id})}
function oReject(id){ownAct('owner_reject_order',{p_order:id})}
var DB={};
function dbSet(id,v){DB[id]=v}
function dbSave(id,v){DB[id]=v;rpc('owner_set_delivered_by',{p_order:id,p_by:v}).then(function(){if(DB[id]===v)delete DB[id]},function(e){toast(friendly(e))})}
function oAdv(id){act(async function(){if(DB[id]!==undefined){await rpc('owner_set_delivered_by',{p_order:id,p_by:DB[id]});delete DB[id]}await rpc('owner_advance_order',{p_order:id});await loadOrders()})}
function oConfirm(id){ownAct('owner_confirm_payment',{p_order:id})}
function where(o){return o.order_type==='table'?'Table '+esc(o.table_label):(o.fulfilment==='delivery'?'Parcel · Delivery':'Parcel · Pickup')}
var NEXT=['Mark preparing','Mark ready','Mark served'];
function nextLbl(o){return o.order_type==='parcel'?(o.fulfilment==='delivery'?['Mark preparing','Mark out for delivery','Mark delivered']:['Mark preparing','Mark ready for pickup','Mark served (picked up)'])[o.status]:NEXT[o.status]}
function sPred(f,o){return f==='all'||(f==='new'&&o.approval==='wait')||(f==='prep'&&o.approval==='ok'&&o.status<3)||(f==='served'&&o.approval==='ok'&&o.status===3)||(f==='rej'&&o.approval==='rej')}
function pPred(f,o){var paid=o.pay_status==='paid';return f==='all'||(f==='paid'&&paid)||(f==='unpaid'&&!paid)}
function ownDelivery(o){

  else h+='<div class="sub" style="margin:0 0 6px">Customer will pick up at the Food Place.</div>';

  }else if(dl&&o.delivered_by)h+='<div class="sub" style="margin:0 0 6px">Delivered by: <b>'+esc(o.delivered_by)+'</b></div>';
  if(o.served_at)h+='<div class="sub" style="margin:0 0 6px">'+(dl?'Delivered':'Handed over')+': <b>'+fmtDT(o.served_at)+'</b></div>';
  if(o.received_at)h+='<div class="ok" style="margin:0 0 8px">Customer confirmed receiving it: <b>'+fmtDT(o.received_at)+'</b></div>';
  else if(o.approval==='ok'&&o.status===3)h+='<div class="sub" style="margin:0 0 6px">Waiting for the customer to confirm receipt.</div>';
  return h;
}

  var h='<h1>Live orders</h1><div class="sub">New orders wait for you to Accept or Reject. Confirm payments here.</div>'+openCard();

    h+='<div style="border-top:1px dashed var(--line);margin-top:8px;padding-top:6px">'+(o.discount_paise>0?discRows(o):'<div class="tot"><span>Subtotal</span><span>'+rs(o.subtotal_paise)+'</span></div>')+(o.charges||[]).map(function(c){return '<div class="tot"><span>'+esc(c.name)+'</span><span>'+rs(c.amount_paise)+'</span></div>'}).join('')+'<div class="tot b"><span>Total</span><span>'+rs(o.total_paise)+'</span></div></div>';

    h+='<div class="row" style="margin-top:6px"><b class="sp">'+payLabel(o)+'</b>'+(o.approval==='ok'&&o.status<3?'<button class="btn sm" onclick="oAdv(\''+o.id+'\')">'+nextLbl(o)+'</button>':'')+'</div>';

    if(o.pay_status==='upipending'&&o.upi_ref)h+='<div class="sub" style="margin:8px 0 0">UPI transaction ID given by the customer: <b>'+esc(o.upi_ref)+'</b></div>';
    if(pend)h+='<button class="btn" style="width:100%;margin-top:10px" onclick="oConfirm(\''+o.id+'\')">'+(o.pay_status==='cashpending'?'Confirm cash received':'Confirm '+pmName(o)+' payment received')+' · '+rs(o.total_paise)+'</button>';
    if(o.approval==='wait')h+='<div class="row" style="margin-top:10px"><button class="btn sp"'+(pend?' disabled':'')+' onclick="oAccept(\''+o.id+'\')">Accept</button><button class="btn ghost sp" onclick="oReject(\''+o.id+'\')">Reject</button></div>';
    h+='</div>';
  });
  return h;
}

  return 'Outside your opening hours ('+hoursText(p)+'). Customers cannot place orders.';

function saveAddr(){

  rest('food_places?id=eq.'+encodeURIComponent(O.place.id)+'&select=*,is_open',{method:'PATCH',prefer:'return=representation',body:{address:a,pincode:z}}).then(function(r){if(r&&r[0]){O.place=r[0];delete O.addrDraft;delete O.pinDraft}toast('Address saved',true)},function(e){toast(e.message)});

function saveContact(v){

/* menu */
function setFm(k,v){O.fm[k]=v}
function addItem(){
  var f=O.fm;f.err='';var pf=toPaise(f.pf),ph=f.ph.trim()===''?null:toPaise(f.ph);
  if(f.n.trim().length<1)f.err='Enter the item name.';
  else if(!(pf>=0)||f.pf.trim()==='')f.err='Enter the price.';
  else if(ph!==null&&!(ph>=0))f.err='Half price is not a number.';
  if(f.err)return render();
  act(async function(){
    await rest('menu_items',{method:'POST',prefer:'return=minimal',body:{place_id:O.place.id,category_id:f.cat||null,name:f.n.trim(),is_veg:!!f.veg,price_full_paise:pf,price_half_paise:ph,note:f.note.trim()}});

}

  O.edit=id;O.askDel='';
  O.ef={n:i.name,cat:i.category_id||'',veg:!!i.is_veg,pf:String(i.price_full_paise/100),ph:i.price_half_paise!=null?String(i.price_half_paise/100):'',note:i.note||'',av:!!i.available,err:''};

  var f=O.ef;if(!f)return;f.err='';

  h+=R.mode==='day'?'<input class="t noprint" type="date" value="'+R.date+'" aria-label="Select date" onchange="rSet(\'date\',this.value||R.date)">':R.mode==='mon'?'<input class="t noprint" type="month" value="'+R.month+'" aria-label="Select month" onchange="rSet(\'month\',this.value||R.month)">':'<input class="t noprint" type="number" min="2000" max="2100" value="'+R.year+'" aria-label="Select year" onchange="rSet(\'year\',String(this.value||R.year))">';

function sumM(a,f){return a.reduce(function(x,o){return x+f(o)},0)}
function chK(c){var n=c.name||'';return /^cgst/i.test(n)?'cgst':/^sgst/i.test(n)?'sgst':c.is_gst?'gst':/^packing/i.test(n)?'pack':/^delivery charge/i.test(n)?'deliv':'other'}
function chSum(L,k){return sumM(L,function(o){return sumM(o.charges||[],function(c){return chK(c)===k?(c.amount_paise||0):0})})}
function vr(l,v,b){return '<div class="item row" style="margin:0"><span class="sp">'+l+'</span><b style="font-size:'+(b?19:17)+'px">'+v+'</b></div>'}

  var T=L2.filter(function(o){return o.order_type==='table'}),PK=L2.filter(function(o){return o.order_type==='parcel'&&o.fulfilment!=='delivery'}),DL=L2.filter(function(o){return o.order_type==='parcel'&&o.fulfilment==='delivery'});
  var CA=L2.filter(isCash),ON=L2.filter(function(o){return !isCash(o)&&o.total_paise>0}),pn=all.filter(function(o){return o.pay_status!=='paid'&&o.pay_status!=='refund'});
  function tp(a){return a.length+' · '+rs(sumM(a,function(o){return o.total_paise}))}
  var pr=[['Orders',L2.length],['Total paid',rs(sumM(L2,function(o){return o.total_paise}))],['Food sales (before tax and charges)',rs(sumM(L2,function(o){return o.subtotal_paise}))],['CGST collected',rs(chSum(L2,'cgst'))],['SGST collected',rs(chSum(L2,'sgst'))]];
  if(sumM(L2,function(o){return o.discount_paise||0}))pr.splice(3,0,['Discounts given ('+L2.filter(function(o){return o.discount_paise>0}).length+' orders)','−'+rs(sumM(L2,function(o){return o.discount_paise||0}))]);

function buildPrintDoc(){
  var rep=repLists(),host=document.createElement('div');host.className='prep-measure';document.body.appendChild(host);
  var pages=[],pg,body;
  function fix(s){return RUPEE?s:s.split('₹').join('Rs. ')}
  function newPage(){pg=document.createElement('div');pg.className='ppage';pg.innerHTML='<div class="phead">'+fix(rep.head)+'</div><div class="pbody"></div><div class="pfoot">Page 99 of 99</div>';host.appendChild(pg);pages.push(pg);body=pg.querySelector('.pbody')}
  function over(){return body.scrollHeight>body.clientHeight+1}
  newPage();
  rep.atoms.forEach(function(a){
    var made=[];
    function add(){
      if(a.html){var d=document.createElement('div');d.className='patom';d.innerHTML=fix(a.html);body.appendChild(d);made.push(d);return}
      var t=body.lastElementChild;
      if(!(t&&t.getAttribute('data-tid')===a.tid)){
        if(a.title){var ti=document.createElement('div');ti.className='ptitle';ti.textContent=a.title;body.appendChild(ti);made.push(ti)}
        t=document.createElement('table');t.className='ptab';t.setAttribute('data-tid',a.tid);
        t.innerHTML='<thead><tr>'+a.cols.map(function(c,i){return '<th class="'+a.al[i]+'">'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody></tbody>';
        body.appendChild(t);made.push(t);
      }
      var tr=document.createElement('tr');tr.innerHTML=fix(a.cells.map(function(c,i){return '<td class="'+a.al[i]+'">'+c+'</td>'}).join(''));
      t.querySelector('tbody').appendChild(tr);made.push(tr);
    }
    add();
    if(over()&&body.children.length>made.filter(function(m){return m.parentNode===body}).length){
      made.forEach(function(m){if(m.parentNode)m.parentNode.removeChild(m)});
      newPage();add();
    }
  });
  pages.forEach(function(p,i){p.querySelector('.pfoot').textContent='Page '+(i+1)+' of '+pages.length});
  var pd=document.getElementById('printdoc');pd.innerHTML='';
  pages.forEach(function(p){pd.appendChild(p)});
  document.body.removeChild(host);
  return pages.length;
}
function doPrint(force){
  try{
    if(!force&&R.rows===null){toast('Please wait. The summary is still loading.');return}
    buildPrintDoc();
    document.body.classList.add('rprint');
    /* Do not clean on 'afterprint': some phones fire it before the Save-as-PDF copy is made, which lost the header. Clean on the app's own done signal or the next touch. */
    var clean=function(){var pd=document.getElementById('printdoc');if(pd)pd.innerHTML='';document.body.classList.remove('rprint');['mfbprintdone','pointerdown','keydown'].forEach(function(e){window.removeEventListener(e,tc,true)});window.__mfbClean=null};
    var tc=function(e){if(e.type!=='mfbprintdone'&&Date.now()-t0<1500)return;clean()};
    var t0=Date.now();if(window.__mfbClean)window.__mfbClean();window.__mfbClean=clean;
    ['mfbprintdone','pointerdown','keydown'].forEach(function(e){window.addEventListener(e,tc,true)});
    setTimeout(mfbPrint,60);
  }catch(e){toast('Could not print: '+(e&&e.message||e))}
}

/* ---------- owner order alerts: sound, vibration, banner, screen-on ---------- */
var AL={seen:null,unack:{},ring:null,ctx:null,p:{snd:true,wake:false,bg:false},wl:null,beeps:0,title:document.title};
(function(){try{var j=JSON.parse(sget('mfb_alert')||'null');if(j){AL.p.snd=j.snd!==false;AL.p.wake=!!j.wake;AL.p.bg=!!j.bg}}catch(e){}})();
function alSave(){sset('mfb_alert',JSON.stringify(AL.p))}
function alUnlock(){
  try{
    if(!AL.ctx){var C0=window.AudioContext||window.webkitAudioContext;if(!C0)return;AL.ctx=new C0()}
    if(AL.ctx.state!=='running')AL.ctx.resume();
  }catch(e){}
}
['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,alUnlock,{passive:true})});
function alBeep(){
  AL.beeps++;
  try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,300])}catch(e){}
  try{
    alUnlock();var c=AL.ctx;if(!c||c.state!=='running')return;
    var t=c.currentTime;
    [[880,0],[1175,0.24],[880,0.48],[1175,0.72]].forEach(function(n){
      var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t+n[1]);g.gain.exponentialRampToValueAtTime(0.5,t+n[1]+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]+0.2);
      o.connect(g);g.connect(c.destination);o.start(t+n[1]);o.stop(t+n[1]+0.22);
    });
  }catch(e){}
}
function alCount(){return Object.keys(AL.unack).length}
function alStartRing(){
  if(AL.ring||!AL.p.snd)return;
  AL.ring=setInterval(function(){if(alCount()&&AL.p.snd)alBeep();else alStopRing()},window.MFB_RING_MS||8000);
}
function alStopRing(){if(AL.ring){clearInterval(AL.ring);AL.ring=null}}
function alState(o){return o.approval==='wait'?'wait':(o.approval==='ok'&&isPend(o)?'pay':'')}
/* returns true when the alert state changed */
function alCheck(orders){
  var map={};(orders||[]).forEach(function(o){var s=alState(o);if(s)map[o.id]=s});
  var changed=false,fresh=0;
  if(AL.seen===null){AL.seen=map;return false}
  Object.keys(map).forEach(function(id){if(AL.seen[id]!==map[id]){AL.unack[id]=map[id];fresh++}});

      rows.forEach(function(o){have[msKey(o.n)]=1});

      e2.skipped.forEach(function(n){if(skipped.indexOf(n)<0)skipped.push(n)});

   +'<div class="tabs one" style="margin-top:10px">'+[['pct','Percentage %'],['fixed','Fixed amount ₹']].map(function(t){return '<button class="'+(f.kind===t[0]?'on':'')+'" onclick="RG.of.kind=\''+t[0]+'\';RG.of.val=\'\';render()">'+t[1]+'</button>'}).join('')+'</div>'
   +'<label class="fl" for="ofv">'+(f.kind==='pct'?'Discount percentage (1 to 100)':'Discount in rupees, taken off every order (1 to 10000)')+'</label><input id="ofv" class="t" inputmode="decimal" maxlength="7" placeholder="'+(f.kind==='pct'?'e.g. 10':'e.g. 50')+'" value="'+esc(f.val)+'" oninput="RG.of.val=this.value">'
   +'<label class="fl" for="oft">Offer message customers see (optional)</label><input id="oft" class="t" maxlength="40" placeholder="e.g. Diwali offer" value="'+esc(f.title)+'" oninput="RG.of.title=this.value">'
   +'<button class="btn" style="width:100%;margin-top:10px"'+(S.busy?' disabled':'')+' onclick="ofSave()">Save and turn ON</button><div class="sub" style="margin:8px 0 0">If a customer is also a regular customer, the better of the two discounts applies. They are not added together.</div></div>';
}
function rgView(){
  var h=ofCard()+'<div class="cat">Regular customer discount</div><div class="item"><div class="sub" style="margin:0;line-height:1.5">Give your regular customers a discount. It is taken off the <b>food amount</b> of every order, before any tax and charges. Service charge, GST and other charges are then worked out on the lower amount. Packing and delivery charges get no discount. The customer sees "You get 10% off here", and the bill shows the discount on its own line. Old bills never change.</div></div>';
  h+='<label class="fl noprint" for="rgq" style="margin-top:4px">Search name or mobile number</label><input id="rgq" class="t" style="background:var(--card);margin-bottom:6px" type="search" placeholder="Name or mobile number" value="'+esc(RG.q)+'" oninput="rgSearch(this.value)">';
  if(RG.err)h+='<div class="err" role="alert">'+esc(RG.err)+'</div>';
  if(RG.loading)return h+'<div class="item">Loading…</div>';
  h+='<div id="rgbody">'+rgBody()+'</div>';
  if(RG.log.length)h+='<div class="cat">Recent changes</div><div class="item" style="padding:6px 12px">'+RG.log.map(function(l){var t={add:'Added',change:'Changed',remove:'Removed'}[l.action];return '<div class="sub" style="margin:6px 0">'+fmtDT(l.created_at)+' · <b>'+t+'</b> '+esc(l.customer_name||'customer')+': '+esc(l.action==='change'?(l.old_value+' to '+l.new_value):(l.new_value||l.old_value||''))+'</div>'}).join('')+'</div>';
  return h;
}

/* bill text (header lines and footer message) settings */
function cleanLines(v,max,n){return String(v||'').replace(/\r/g,'').split('\n').map(function(x){return x.replace(/\s+/g,' ').trim().slice(0,max)}).filter(Boolean).slice(0,n).join('\n')}
function billTextHtml(){
  var p=O.place;
  return '<div class="cat">Bill header lines (optional)</div><div class="item"><label class="fl" for="bh" style="margin-top:0">Registration numbers on the bill, one per line (up to 4 lines)</label><div class="sub" style="margin:2px 0 6px">For example: GSTIN: 27ABCDE1234F1Z5 · FSSAI Lic. No: 12345678901234. Leave empty if you have none. It prints under your Food Place name.</div><textarea id="bh" class="t" rows="3" maxlength="200" placeholder="GSTIN: ...&#10;FSSAI Lic. No: ..." onchange="saveBillText(\'bill_header\',this.value,4,40)">'+esc(O.bhDraft!==undefined?O.bhDraft:(p.bill_header||''))+'</textarea></div>'
   +'<div class="cat">Bill footer message (optional)</div><div class="item"><label class="fl" for="bf" style="margin-top:0">Message at the bottom of the bill (up to 2 lines)</label><div class="sub" style="margin:2px 0 6px">For example: Happy Diwali! Visit again. Leave empty for no message.</div><textarea id="bf" class="t" rows="2" maxlength="200" placeholder="Happy Diwali!" onchange="saveBillText(\'bill_footer\',this.value,2,100)">'+esc(O.bfDraft!==undefined?O.bfDraft:(p.bill_footer||''))+'</textarea><div class="sub" style="margin:6px 0 0">New text shows on new orders. Bills already placed keep what they had.</div></div>';
}
function saveBillText(col,v,n,max){
  var c=cleanLines(v,max,n);
  savePlace((function(){var b={};b[col]=c;return b})(),c?'Saved':'Removed').then(function(){delete O.bhDraft;delete O.bfDraft;render()});
}
function billTextBlock(t,cls){
  t=String(t||'').trim();if(!t)return '';
  return '<div class="'+(cls||'')+'" style="text-align:center;white-space:pre-line;font-size:13px;margin:6px 0">'+esc(t)+'</div>';
}

/* discount lines on any bill */
function discRows(o){
  if(!(o.discount_paise>0))return '';
  return '<div class="tot"><span>Subtotal</span><span>'+rs(o.subtotal_paise)+'</span></div><div class="tot" style="color:var(--acc,#0e7f6c)"><span>'+esc(discName(o))+'</span><span>−'+rs(o.discount_paise)+'</span></div><div class="tot"><span>Food after discount</span><span>'+rs(o.subtotal_paise-o.discount_paise)+'</span></div>';
}

/* print a single bill (customer or owner) using the same A4 printing as the summaries */
function printBill(id){
  var o=(C&&C.order&&C.order.id===id)?C.order:(O.orders||[]).filter(function(x){return x.id===id})[0];
  if(!o){toast('Bill not found');return}
  R.bill=o;try{doPrint(true)}finally{R.bill=null}
}
function billDoc(o){
  var owner=S.prof.role==='owner',pl=owner?O.place:(o.food_places||{}),nm=pl.name||'',A=[];
  var head='<div class="pl">'+LOGO(30)+'<span>MyFoodBill</span></div><div class="p2">'+esc(nm)+(pl.code?' · Code '+esc(pl.code):'')+'</div>'
    +String(o.bill_header||'').split('\n').filter(Boolean).map(function(x){return '<div class="p5">'+esc(x)+'</div>'}).join('')
    +(pl.address?'<div class="p5">'+esc(String(pl.address).replace(/\s*\n\s*/g,', ')+(pl.pincode?' - '+pl.pincode:''))+'</div>':'')
    +(pl.contact_phone?'<div class="p5">Mobile: '+esc(pl.contact_phone)+'</div>':'')
    +'<div class="p3">Bill · '+esc(o.order_no)+'</div><div class="p4">'+esc(fmtDT(o.created_at))+'</div>';
  A.push({html:'<div class="pgrid"><div><span>Token</span><b>'+esc(String(o.token))+'</b></div><div><span>Order</span><b>'+(o.order_type==='table'?'Table '+esc(o.table_label):(o.fulfilment==='delivery'?'Parcel · Delivery':'Parcel · Pickup'))+'</b></div><div><span>Customer</span><b>'+esc(o.customer_name||S.prof.name||'')+'</b></div></div>'});
  (o.order_items||[]).forEach(function(i,k){A.push({tid:'bi',title:k?'':'Items',cols:['Item','Qty','Rate','Amount'],al:['l','r','r','r'],cells:[esc(i.name),i.qty,rs(i.price_paise),rs(i.price_paise*i.qty)]})});
  var t='<table class="ptab"><tbody>'+'<tr><td>Subtotal</td><td class="r">'+rs(o.subtotal_paise)+'</td></tr>';
  if(o.discount_paise>0)t+='<tr><td>'+esc(discName(o))+'</td><td class="r">−'+rs(o.discount_paise)+'</td></tr><tr><td>Food after discount</td><td class="r">'+rs(o.subtotal_paise-o.discount_paise)+'</td></tr>';
  (o.charges||[]).forEach(function(c){t+='<tr><td>'+esc(c.name)+'</td><td class="r">'+rs(c.amount_paise)+'</td></tr>'});
  t+='<tr><td><b>Total</b></td><td class="r"><b>'+rs(o.total_paise)+'</b></td></tr></tbody></table>';
  A.push({html:t});
  if(o.pay_status==='paid')A.push({html:'<div class="pnote">Paid'+(o.pay_method&&o.pay_method!=='Free'?' via '+esc(o.pay_method):'')+(o.paid_at?' · '+esc(fmtDT(o.paid_at)):'')+'</div>'});
  if(o.bill_footer)A.push({html:'<div class="pnote" style="text-align:center;white-space:pre-line">'+esc(o.bill_footer)+'</div>'});
  return {head:head,atoms:A};
}

/* discount report for the CA: one row per discounted, paid order; order number only (no customer names) */
function printDiscReport(){R.disc=true;try{doPrint()}finally{R.disc=false}}
function discDoc(rows){
  var rg=rLabel(),head='<div class="pl">'+LOGO(30)+'<span>MyFoodBill</span></div><div class="p2">'+esc(O.place.name+' · Code '+O.place.code)+'</div>'
    +String(O.place.bill_header||'').split('\n').filter(Boolean).map(function(x){return '<div class="p5">'+esc(x)+'</div>'}).join('')
    +'<div class="p3">Discount report · '+esc(rg.replace(/^(Daily|Monthly|Yearly) summary · /,''))+'</div><div class="p4">Printed on '+esc(fmtDT(Date.now()))+'</div>';
  var L=rows.filter(function(o){return o.approval==='ok'&&o.pay_status==='paid'&&o.discount_paise>0});
  L.sort(function(a,b){return a.created_at<b.created_at?-1:1});
  var A=[],S1=sumM(L,function(o){return o.subtotal_paise}),D1=sumM(L,function(o){return o.discount_paise});
  var cg=chSum(L,'cgst'),sg=chSum(L,'sgst'),tt=sumM(L,function(o){return o.total_paise});
  A.push({html:'<div class="pgrid"><div><span>Discounted orders</span><b>'+L.length+'</b></div><div><span>Food amount</span><b>'+rs(S1)+'</b></div><div><span>Discounts given</span><b>'+rs(D1)+'</b></div><div><span>Food after discount</span><b>'+rs(S1-D1)+'</b></div><div><span>CGST</span><b>'+rs(cg)+'</b></div><div><span>SGST</span><b>'+rs(sg)+'</b></div></div>'});
  if(!L.length){A.push({html:'<div class="pnote">No discounted orders in this period.</div>'});return {head:head,atoms:A}}
  L.forEach(function(o,i){
    var oc=o.total_paise-(o.subtotal_paise-o.discount_paise)-chSumO(o,'cgst')-chSumO(o,'sgst');
    A.push({tid:'dr',title:i?'':'Discounted orders',cols:['Date','Order no.','Food','Discount','After disc.','CGST','SGST','Other','Total'],al:['l','l','r','r','r','r','r','r','r'],cells:[esc(new Date(o.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'})),esc(o.order_no),rs(o.subtotal_paise),rs(o.discount_paise)+(/%$/.test(o.discount_label||'')?' ('+esc(o.discount_label)+')':''),rs(o.subtotal_paise-o.discount_paise),rs(chSumO(o,'cgst')),rs(chSumO(o,'sgst')),rs(oc),'<b>'+rs(o.total_paise)+'</b>']});
  });
  A.push({html:'<div class="pnote">Other = service charge, other taxes, packing and delivery charges. Taxes are shown as charged on the bill. Please check the tax treatment with your CA.</div>'});
  return {head:head,atoms:A};
}
function chSumO(o,k){return chSum([o],k)}
</script>
